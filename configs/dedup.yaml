# Duplicate and leakage audit (Milestone 3). Read by openinspect.dedup.config.
#
# A model entry pins the exact weights: the Hub revision (a commit id, never a branch name) and the
# SHA-256 of the weights file, which is verified after every download. Weights are safetensors only.
schema_version: 1

preprocessing:
  version: v1        # whole image, bicubic to 224x224, ImageNet mean/std (openinspect.dedup.features)

backend: cpu-fp32    # results of different backends are never mixed: each has its own cache directory

default_model: dinov2-small

models:
  dinov2-small:
    model_id: facebook/dinov2-small
    revision: ed25f3a31f01632728cabb09d1542f84ab7b0056
    weights_file: model.safetensors
    weights_sha256: ae1e99fcefd534ed978cdeb8326f08030c96e28b7a81ffcbc98a857c84d14be1
    dim: 384
    licence: Apache-2.0   # model card, read on 2026-09-30
  dinov2-base:
    model_id: facebook/dinov2-base
    revision: f9e44c814b77203eaa57a6bdbbd535f21ede1415
    weights_file: model.safetensors
    weights_sha256: d73036b56966966d07975d696bde331762f37297e2f095de8cea0040c3aa0841
    dim: 768
    licence: Apache-2.0
