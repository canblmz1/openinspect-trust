provenance_risks:
  acquisition_environment: "Factory AOI line (AGLE'OL AOI-100 V8, controllable LED lighting, 16K line-scan, eight cameras), inner/outer-layer inspection after etching. Images were pre-processed by the authors (noise removal, contrast enhancement, brightness adjustment)."
  independence_notes: "Producers per paper affiliations: South China Agricultural University, Guangzhou FastPrint Technology Co., Ltd, CEPREI. No shared authors or institutions with pcb-defect or pcb-ind. Same modality as pcb-ind (factory AOI etch-stage crops)."
  known_duplicates: "0 exact duplicates (SHA-256) among the 10,259 images (M2). Near-duplicates are unmeasured until M3. The archive ships Hash.py, the authors' 16x16 dHash script (Hamming distance < 4, per folder); whether it was applied to the released images is not documented. The number of crops per board is not stated, so adjacent or overlapping crops of one board may exist."
  known_weaknesses:
    - "Official split is a random image-level 8:2 train/val split with no board-level grouping stated: the leakage pattern this project measures."
    - "Local crops around defects (selection bias toward AOI-detectable regions); defects may look incomplete in a crop (paper)."
    - "Pixel data were pre-processed by the authors; not raw AOI output."
    - "2D information only; pre-solder-mask stages only (paper)."
    - "An unofficial Kaggle mirror exists (enisteper1/dataset-of-pcb-surface-defects-dspcbsd). Do NOT use it; the figshare record is the source of truth."
    - "Measured at ingest (M2): 111 images (the *_data.jpg family) are 108x108 pixels, the other 10,148 are 226x226; three files have Windows copy-suffix names ('name (n).jpg')."
    - "Measured at ingest (M2): the archive ships COCO and YOLO annotations only (the record and paper also mention VOC), each with its own byte-identical copy of the images; the COCO licenses entry has no name and no URL, so the licence is stated only on the repository record."
    - "Measured at ingest (M2): file names carry a family code (S, Y, E, digits, data) and a number, but consecutive numbers are hardly more alike than random pairs: no board identifier can be derived."
    - "Pixel pitch is not in the files. Measured at ingest (M2): no image carries EXIF or a DPI value (the JFIF density is an aspect ratio only), so pixel_pitch_um stays null."
  synthetic_or_engineered_defects: false

