provenance_risks:
  acquisition_environment: "Lab: single-layer FR4 boards made by chemical etching with defects designed in ECAD, scanned on an HP ScanJet Pro 3600 f1 flatbed at 1600 dpi, 24-bit colour JPEG, no auto-enhancement (paper)."
  independence_notes: "Islamic University of Technology (Bangladesh). No shared authors or institutions with dspcbsd-plus or pcb-ind. Lab-made boards + flatbed scanner: the largest domain gap of the three sources."
  known_duplicates: "None stated. Each image is a distinct board (one image per board)."
  known_weaknesses:
    - "Defects were engineered on purpose (physically real, but placed by design) and classes are near-balanced (246-356 boxes each): not a natural long-tail distribution."
    - "Single-layer boards, no solder mask, lab lighting, flatbed scanner (paper)."
    - "Small: 230 images. As a held-out source its confidence intervals will be wide."
    - "Whether images were cropped or resized after scanning is not stated; released sizes (2.6-31 MP) are below a full 5x8 in scan at 1600 dpi, so the physical pixel pitch of released images is unknown."
    - "Author-name spellings differ between the dataset record ('Mamun Mian') and the paper ('Md. Mamun Mian'): use the dataset record's 'Cite as' for the dataset and the paper's for the paper."
    - "Mendeley's licence text carries a generic caveat about third-party content. None is identified in the record and the paper describes original fabrication; re-check at ingest for logos or third-party marks."
  synthetic_or_engineered_defects: true

