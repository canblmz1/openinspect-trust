content:
  domain: pcb-surface-defects
  task: detection
  annotation_format: [yolo, voc, coco]
  annotation_tool: "X-AnyLabeling-assisted refinement, expert confirmation (paper)"
  image_count: 4789
  annotation_count: 5932
  image_size_px: {min: [300, 300], max: [300, 300]}
  pixel_pitch_um: null
  colour: rgb
  original_classes:
