[project]
name = "openinspect-trust"
version = "0.1.0.dev1"
description = "Provenance-aware cross-dataset benchmark tooling for industrial defect detection"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "defusedxml>=0.7.1,<1",
    "httpx>=0.27,<1",
    "pillow>=10.3",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0.1,<7",
    "typer>=0.12",
]

[project.scripts]
openinspect = "openinspect.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "types-defusedxml>=0.7",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openinspect"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "N", "S", "T20"]
# The formatter keeps code at 100 columns; long string literals are allowed.
ignore = ["E501"]
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "S311"]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["openinspect"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover"]
